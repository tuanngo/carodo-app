packages:
  - apps/*
  - packages/*

# Every external version, once: each package.json says `catalog:`, so api and web cannot drift.
# Only releases older than pnpm's minimum release age; never add minimumReleaseAgeExclude to take
# a newer one (a day-old release waits a day).
# A new entry is a new dependency and needs the owner's approval (carodo-ios AGENTS.md, P6).
catalog:
  "@tailwindcss/cli": 4.3.5
  tailwindcss: 4.3.5
  "@biomejs/biome": 2.6.6
  "@cloudflare/vitest-plugin": 1.7.0
  "@types/node": 26.6.6
  hono: 4.13.18
  typescript: 7.0.2
  vitest: 5.1.0
  wrangler: 4.160.0

# Packages that run an install script. pnpm refuses any other.
# workerd downloads the runtime binary; esbuild its native binary.
allowBuilds:
  "@parcel/watcher": false # Tailwind uses the platform prebuilt watcher; no install script.
  esbuild: true
  workerd: true

